      <stop offset="0%" stop-color="#05061a"/>
      <stop offset="60%" stop-color="#0d1240"/>
      <stop offset="100%" stop-color="#1b1060"/>
    </linearGradient>
    <radialGradient id="nebula1" cx="25%" cy="70%" r="45%">
      <stop offset="0%" stop-color="#8a2be2" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#8a2be2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebula2" cx="78%" cy="30%" r="40%">
      <stop offset="0%" stop-color="#00c8ff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#00c8ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="meteor" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="rgb" x1="0" y1="0" x2="900" y2="0" gradientUnits="userSpaceOnUse" spreadMethod="repeat">
